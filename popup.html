<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceIn Settings</title>
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.3);
      --glass-strong: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --line: rgba(255, 255, 255, 0.28);
      --ink: #1a1a2e;
      --muted: #5c6478;
      --orange: #f97316;
      --shadow: 0 16px 44px rgba(26, 26, 46, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      min-height: 100vh;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(220px 160px at 0% 0%, rgba(249,115,22,0.42), transparent 70%),
        radial-gradient(200px 180px at 100% 8%, rgba(245,200,0,0.5), transparent 70%),
        radial-gradient(240px 200px at 85% 100%, rgba(110,80,220,0.32), transparent 70%),
        radial-gradient(200px 160px at 5% 95%, rgba(0,160,210,0.28), transparent 70%),
        #e9ebf2;
    }
    .wrap { padding: 14px; }
    .card {
      position: relative;
      background: linear-gradient(135deg,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(6px) saturate(160%);
      -webkit-backdrop-filter: blur(6px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -2px 6px rgba(255,255,255,0.15), inset 0 0 12px rgba(255,255,255,0.08);
      padding: 16px;
      overflow: hidden;
    }
    .card::after { content: none; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; position: relative; z-index: 1; }
    .logo {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg,#fb923c,#ea580c); display: grid; place-items: center; flex: none;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 6px 18px rgba(249,115,22,0.35);
    }
    .logo svg { width: 18px; height: 18px; fill: #fff; }
    h1 { font-size: 15px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
    .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); position: relative; z-index: 1; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
    .label { font-weight: 600; font-size: 13px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .field { margin-top: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    select, .kbd-box {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.02));
      backdrop-filter: blur(6px) saturate(160%);
      -webkit-backdrop-filter: blur(6px) saturate(160%);
      color: var(--ink);
      border-radius: 14px;
      padding: 9px 11px;
      font: inherit;
      font-size: 13px;
      outline: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -2px 6px rgba(255,255,255,0.15), inset 0 0 12px rgba(255,255,255,0.08);
    }
    select:focus { border-color: rgba(249,115,22,0.5); box-shadow: inset 0 1px 1px rgba(255,255,255,0.75), 0 0 0 4px rgba(249,115,22,0.15); }
    .kbd-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; color: var(--ink); }
    .link {
      border: none; background: none; color: var(--orange); font: inherit; font-size: 12px; font-weight: 600;
      padding: 0; cursor: pointer; text-decoration: none;
    }
    .link:hover { text-decoration: underline; }
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
      background: rgba(0,0,0,0.12); border: 1px solid rgba(255,255,255,0.45);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.12); transition: .2s ease;
    }
    .slider:before {
      content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
      background: linear-gradient(135deg,#fff,#f0f0f5); border-radius: 50%; transition: .2s ease;
      box-shadow: 0 1px 4px rgba(0,0,0,0.22), inset 0 1px 1px #fff;
    }
    .switch input:checked + .slider { background: linear-gradient(135deg,#fb923c,#ea580c); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .note {
      position: relative; z-index: 1;
      margin-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.4;
      background: linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px) saturate(160%); -webkit-backdrop-filter: blur(6px) saturate(160%);
      border-radius: 14px; padding: 9px 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -2px 6px rgba(255,255,255,0.15), inset 0 0 12px rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </div>
        <div>
          <h1>VoiceIn</h1>
          <p class="sub">Dictate into any text field</p>
        </div>
      </div>

      <div class="row">
        <div>
          <div class="label">Enable voice input</div>
          <div class="hint">Show the glass mic dock on pages</div>
        </div>
        <label class="switch" aria-label="Enable voice input">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="section">
        <div class="field">
          <label for="lang">Language</label>
          <select id="lang">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="en-UG">English (Uganda)</option>
            <option value="sw-KE">Kiswahili</option>
            <option value="fr-FR">Français</option>
            <option value="es-ES">Español</option>
            <option value="de-DE">Deutsch</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="ar-SA">العربية</option>
            <option value="hi-IN">हिन्दी</option>
            <option value="zh-CN">中文 (简体)</option>
            <option value="ja-JP">日本語</option>
          </select>
        </div>

        <div class="field">
          <label>Keyboard shortcut</label>
          <div class="kbd-box">
            <span class="kbd" id="shortcut">⌘/Ctrl + Shift + V</span>
            <button type="button" class="link" id="shortcuts">Customize</button>
          </div>
          <div class="hint" style="margin-top:6px">Start or stop dictation instantly</div>
        </div>
      </div>

      <div class="note" id="status">Checking this page…</div>
      <div class="note">Just click any text field and speak — dictation starts by itself. Words appear live and drop into the field as they're transcribed.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
